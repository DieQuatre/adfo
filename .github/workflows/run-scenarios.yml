name: Run 35 Scenarios

# SADECE elle tetiklenir (Actions sekmesi → Run workflow).
#
# Önceden `push` ile otomatik tetikleniyor ve sonuçları repoya geri
# commit'liyordu. Bu tehlikeliydi: algorithms/ veya run_batch.py'a dokunan
# HER push, elde koşulmuş ölçümleri varsayılan ayarlarla (5 instance,
# 100 iterasyon) üretilmiş zayıf sonuçlarla sessizce eziyordu. Yayına
# gidecek ölçümler kaza eseri değil, bilinçli olarak üretilmeli.
on:
  workflow_dispatch:
    inputs:
      instances:
        description: 'Senaryo başına instance sayısı'
        required: false
        default: '5'
      depso_iter:
        description: 'DEPSO iterasyon sayısı (paper: 500)'
        required: false
        default: '500'

# En az ayrıcalık: iş yalnızca repoya yazabilsin.
permissions:
  contents: write

jobs:
  run-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # 500 iterasyon + 200 siparişlik senaryolar yavaş
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run all 7 batches
        run: |
          mkdir -p results
          for i in 1 2 3 4 5 6 7; do
            echo "════════ Batch $i / 7 başlıyor ════════"
            python -u run_batch.py --batch $i \
              --n "${{ inputs.instances }}" \
              --depso-iter "${{ inputs.depso_iter }}"
            echo "════════ Batch $i bitti ════════"
          done

      # Bağımsızlık kontrolünü de burada yap: iki senaryo birebir aynı
      # sonucu verirse rapor bunu yazar ve gözden kaçmaz.
      - name: Rapor üret
        run: python regen_35.py

      - name: List results
        run: |
          echo "=== Üretilen dosyalar ==="
          ls -la results/

      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add results/batch_*.json results/paper_35_scenarios.md results/paper_35_scenarios.json
          if git diff --staged --quiet; then
            echo "Sonuçlarda değişiklik yok, commit atlanıyor."
          else
            git commit -m "🤖 Auto-update: 35 senaryo sonuçları yenilendi"
            # Workflow çalışırken push edilmiş yeni commit'leri çek
            git pull --rebase origin master || git pull --rebase origin main
            git push
          fi
